name: Sincronizar planilhas do catálogo

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "data/**"

permissions:
  contents: write

concurrency:
  group: sincronizar-planilhas
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Testar enriquecimento de LOCAL do AgroCultura
        run: node --test tests/agrocultura-local.test.mjs

      - name: Testar snapshot local do catálogo
        run: node --test tests/catalogo-snapshot.test.mjs tests/dados-local-first.test.mjs

      - name: Testar snapshot de afiliadas e repórteres
        run: node --test tests/afiliadas-reporteres-snapshot.test.mjs

      - name: Testar palavras-chave por Media ID
        run: node --test tests/palavras-chave.test.mjs

      - name: Testar frescor do snapshot
        run: node --test tests/snapshot-freshness.test.mjs

      - name: Testar sincronização, prefixos e erros de permissão
        run: node --test tests/programa-por-prefixo.test.mjs tests/google-sheets-errors.test.mjs tests/sincronizar-planilhas-fontes.test.mjs

      - name: Sincronizar planilhas
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:planilhas

      - name: Guardar relatórios completos de divergências entre planilhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-metadados
          path: auditorias/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resumir divergências identificadas
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const [rotulo, arquivo] of [["Fontes", "auditorias/fontes.json"], ["Notícias/VTs", "auditorias/noticias-agrocultura.json"]]) {
            if (!fs.existsSync(arquivo)) continue;
            const relatorio = JSON.parse(fs.readFileSync(arquivo, "utf8"));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `- **${rotulo}:** ${relatorio.resumo.totalConflitos} conflito(s), ${relatorio.resumo.totalMediaIds} MediaID(s); detalhes no artefato auditoria-metadados.\n`);
          }
          NODE

      - name: Gerar snapshot principal do catálogo
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:catalogo

      - name: Gerar snapshot de afiliadas e repórteres
        id: gerar_afiliadas
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:afiliadas

      - name: Alertar quando o cadastro de afiliadas e repórteres não sincroniza
        if: steps.gerar_afiliadas.outcome == 'failure'
        run: |
          echo "::warning title=Cadastro de afiliadas e repórteres::Falha na leitura da planilha Google. O snapshot publicado pode estar desatualizado. Verifique o acesso da conta de serviço à aba repórteres."
          echo "### Cadastro de afiliadas e repórteres não atualizado" >> "$GITHUB_STEP_SUMMARY"
          echo "A sincronização da planilha de referência falhou. O snapshot anterior foi preservado. Verifique a permissão da conta de serviço GOOGLE_SERVICE_ACCOUNT_JSON na planilha de afiliadas/repórteres." >> "$GITHUB_STEP_SUMMARY"

      - name: Gerar palavras-chave e enriquecimento
        run: npm run sync:keywords

      - name: Validar frescor do snapshot principal
        env:
          SNAPSHOT_MAX_AGE_MINUTES: "20"
        run: npm run check:snapshot

      - name: Gerar acervo estruturado do AgroCultura
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:agrocultura

      - name: Evitar atualização sem mudança de conteúdo
        run: node scripts/estabilizar-snapshots.mjs data/catalogo-acervo.json data/agrocultura-acervo.json data/afiliadas-reporteres.json data/media-enrichment.json data/sincronizacao-status.json

      - name: Atualizar indicadores horários da sincronização
        run: node scripts/atualizar-status-sincronizacao.mjs

      - name: Publicar snapshots do catálogo
        run: |
          if [ -z "$(git status --porcelain -- data/catalogo-acervo.json data/agrocultura-acervo.json data/afiliadas-reporteres.json data/media-enrichment.json data/sincronizacao-status.json)" ]; then
            echo "Nenhuma alteração nos snapshots do catálogo."
            exit 0
          fi

          mkdir -p /tmp/catalogo-snapshots
          cp data/catalogo-acervo.json /tmp/catalogo-snapshots/catalogo-acervo.json
          cp data/agrocultura-acervo.json /tmp/catalogo-snapshots/agrocultura-acervo.json
          cp data/afiliadas-reporteres.json /tmp/catalogo-snapshots/afiliadas-reporteres.json
          cp data/sincronizacao-status.json /tmp/catalogo-snapshots/sincronizacao-status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3 4 5; do
            echo "Tentativa ${tentativa}/5 de publicar os snapshots..."

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/catalogo-snapshots/catalogo-acervo.json data/catalogo-acervo.json
            cp /tmp/catalogo-snapshots/agrocultura-acervo.json data/agrocultura-acervo.json
            cp /tmp/catalogo-snapshots/afiliadas-reporteres.json data/afiliadas-reporteres.json
            cp /tmp/catalogo-snapshots/sincronizacao-status.json data/sincronizacao-status.json

            # Recalcula depois do reset para preservar qualquer palavra-chave manual
            # que tenha sido adicionada à main enquanto esta execução estava em andamento.
            npm run sync:keywords
            node scripts/estabilizar-snapshots.mjs data/catalogo-acervo.json data/agrocultura-acervo.json data/afiliadas-reporteres.json data/media-enrichment.json data/sincronizacao-status.json

            git add data/catalogo-acervo.json data/agrocultura-acervo.json data/afiliadas-reporteres.json data/media-enrichment.json data/sincronizacao-status.json

            if git diff --cached --quiet; then
              echo "Os snapshots já estão atualizados na branch main."
              exit 0
            fi

            git commit -m "chore: atualiza snapshots do catálogo"

            if git push origin HEAD:main; then
              echo "Snapshots publicados com sucesso."
              exit 0
            fi

            if [ "$tentativa" -lt 5 ]; then
              echo "A branch main mudou durante o push; reaplicando os snapshots sobre a versão mais recente..."
              sleep 2
            fi
          done

          echo "Não foi possível publicar os snapshots após 5 tentativas."
          exit 1
