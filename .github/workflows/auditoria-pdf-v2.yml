name: Validar parser PDF v2 da auditoria

on:
  push:
    branches:
      - fix/auditoria-2026-09-25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Atualizar lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Versionar lockfile atualizado
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está atualizado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: atualiza lockfile para pdf-parse v2"
            git push origin HEAD:fix/auditoria-2026-09-25
          fi

      - name: Instalar dependências pelo lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rodar suíte completa
        run: npm test

      - name: Validar sincronização real de créditos sem publicar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_CREDITOS_FOLDER_ID: "1_9_olIPKl6qlQROGrILAU5Dz1pYYoRik"
        run: |
          npm run sync:creditos
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const status = JSON.parse(fs.readFileSync("data/creditos-status.json", "utf8"));
          const erros = Array.isArray(status.erros) ? status.erros : [];
          const rejeitados = Array.isArray(status.rejeitadosNovos) ? status.rejeitadosNovos : [];
          console.log(`Erros de leitura: ${erros.length}`);
          console.log(`Conflitos novos bloqueantes: ${rejeitados.length}`);
          if (erros.length) {
            console.error(JSON.stringify(erros, null, 2));
            process.exit(1);
          }
          if (rejeitados.length) {
            console.error(JSON.stringify(rejeitados, null, 2));
            process.exit(1);
          }
          NODE
