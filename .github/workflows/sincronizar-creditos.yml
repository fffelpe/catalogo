name: Sincronizar créditos

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/media-id.mjs"
      - "scripts/creditos-conflitos.mjs"
      - "scripts/sincronizar-creditos.mjs"
      - "tests/creditos-conflitos.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sincronizar-creditos.yml"

permissions:
  contents: write

concurrency:
  group: sincronizar-creditos
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Testar resolução de conflitos de créditos
        run: node --test tests/creditos-conflitos.test.mjs

      - name: Sincronizar créditos do Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_CREDITOS_FOLDER_ID: "1_9_olIPKl6qlQROGrILAU5Dz1pYYoRik"
        run: npm run sync:creditos

      - name: Publicar alterações
        run: |
          if [ -z "$(git status --porcelain -- data/creditos.json data/creditos-status.json)" ]; then
            echo "Nenhuma alteração nos créditos."
            exit 0
          fi

          mkdir -p /tmp/catalogo-creditos
          cp data/creditos.json /tmp/catalogo-creditos/creditos.json
          cp data/creditos-status.json /tmp/catalogo-creditos/creditos-status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3 4 5; do
            echo "Tentativa ${tentativa}/5 de publicar os créditos..."

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/catalogo-creditos/creditos.json data/creditos.json
            cp /tmp/catalogo-creditos/creditos-status.json data/creditos-status.json
            git add data/creditos.json data/creditos-status.json

            if git diff --cached --quiet; then
              echo "Os créditos já estão atualizados na branch main."
              exit 0
            fi

            git commit -m "chore: sincroniza créditos do Google Drive"

            if git push origin HEAD:main; then
              echo "Créditos publicados com sucesso."
              exit 0
            fi

            if [ "$tentativa" -lt 5 ]; then
              echo "A branch main mudou durante o push; reaplicando os créditos sobre a versão mais recente..."
              sleep 2
            fi
          done

          echo "Não foi possível publicar os créditos após 5 tentativas."
          exit 1

      - name: Rejeitar novos conflitos de créditos
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const status = JSON.parse(fs.readFileSync("data/creditos-status.json", "utf8"));
          const rejeitados = Array.isArray(status.rejeitadosNovos) ? status.rejeitadosNovos : [];

          if (!rejeitados.length) {
            console.log("Nenhum novo conflito bloqueante de créditos.");
            process.exit(0);
          }

          console.error(`Validação rejeitou ${rejeitados.length} Media ID(s) com duplicidade não resolvida.`);
          for (const item of rejeitados) {
            console.error(`\n${item.id}: ${item.motivo}`);
            for (const passo of item.instrucoes || []) console.error(`  - ${passo}`);
          }
          process.exit(1);
          NODE
