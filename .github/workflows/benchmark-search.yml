name: Benchmark busca antes e depois

on:
  push:
    branches:
      - benchmark/search-before-after
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar repositório com histórico
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar snapshots dos commits
        shell: bash
        run: |
          cp scripts/benchmark-search.mjs /tmp/benchmark-search.mjs
          git worktree add /tmp/catalogo-before b3ce07217126f3dab312ec168a6e9b58c62820b0
          git worktree add /tmp/catalogo-after 9e5bd37afc0c2fcd49d1c4bb710825fec72f5307

      - name: Antes da otimização
        run: BENCH_ROUNDS=2 node /tmp/benchmark-search.mjs /tmp/catalogo-before before | tee /tmp/before.log

      - name: Depois da otimização
        run: BENCH_ROUNDS=2 node /tmp/benchmark-search.mjs /tmp/catalogo-after after | tee /tmp/after.log

      - name: Resumo bruto
        if: always()
        shell: bash
        run: |
          echo '=== BEFORE ==='
          cat /tmp/before.log || true
          echo '=== AFTER ==='
          cat /tmp/after.log || true
