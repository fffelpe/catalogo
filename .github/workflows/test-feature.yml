name: Testar catálogo

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar dependências
        run: npm install --ignore-scripts
      - name: Rodar testes
        run: npm test
