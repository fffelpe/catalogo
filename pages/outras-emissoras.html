<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
  <title>Imagens de outras emissoras - Catálogo de Mídias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=6">
  <link rel="stylesheet" href="../css/outras-emissoras.css?v=1">
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="logo" aria-label="Catálogo de Mídias - Início">
      <img src="../images/logo.png" alt="Logo TV Cultura" class="logo-icon">
      <span class="logo-text"><span class="titulo">CATÁLOGO DE MÍDIAS</span><span class="subtitulo">JORNALISMO</span></span>
    </a>
  </header>
  <main class="pagina-resultados outras-pagina">
    <nav class="outras-voltar" aria-label="Navegação"><a href="../index.html">‹ Voltar ao início</a></nav>
    <header class="outras-cabecalho">
      <span class="eyebrow">Acervo especial</span>
      <h1>Imagens de outras emissoras</h1>
      <p>Materiais organizados por emissora, separados do acervo principal da TV Cultura.</p>
    </header>
    <section aria-labelledby="tituloEmissoras">
      <h2 id="tituloEmissoras" class="section-title">Selecionar emissora</h2>
      <div id="listaEmissoras" class="outras-abas" role="group" aria-label="Filtrar por emissora"></div>
    </section>
    <section aria-labelledby="tituloConteudos">
      <div class="outras-controles">
        <div>
          <h2 id="tituloConteudos" class="section-title">Conteúdos cadastrados</h2>
          <p id="statusOutras" class="outras-status" role="status" aria-live="polite">Carregando emissoras...</p>
        </div>
        <label class="outras-busca">Pesquisar nos conteúdos
          <input id="buscaOutras" type="search" placeholder="Descrição, data ou Media ID" autocomplete="off">
        </label>
      </div>
      <div id="cardsOutras" class="outras-grade" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="videoOutras" class="outras-dialog" aria-labelledby="videoOutrasTitulo">
    <div class="outras-dialog-topo">
      <h2 id="videoOutrasTitulo">Reproduzir vídeo</h2>
      <button id="fecharVideoOutras" type="button" aria-label="Fechar vídeo">Fechar ×</button>
    </div>
    <video id="playerOutras" controls playsinline preload="none"></video>
    <p id="erroVideoOutras" role="status" aria-live="polite"></p>
  </dialog>
  <script src="../js/media-id.js?v=1"></script>
  <script src="../js/media-player.js?v=1"></script>
  <script type="module" src="../js/outras-emissoras.js?v=1"></script>
</body>
</html>
