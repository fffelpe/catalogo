<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
  <title>Catálogo de Mídias - Programa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=6">
  <link rel="stylesheet" href="../css/creditos.css?v=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="logo" aria-label="Catálogo de Mídias - Início">
      <img src="../images/logo.png" alt="Logo TV Cultura" class="logo-icon">
      <span class="logo-text">
        <span class="titulo">CATÁLOGO DE MÍDIAS</span>
        <span class="subtitulo">JORNALISMO</span>
      </span>
    </a>
  </header>

  <main class="pagina-resultados pagina-programa">
    <section class="cabecalho-programa" aria-labelledby="tituloPrograma">
      <span class="eyebrow">Acervo por programa</span>
      <h1 class="page-title page-title-principal" id="tituloPrograma">Programa</h1>

      <form id="searchForm" class="search-bar d-flex" role="search">
        <input type="search" id="searchInput" placeholder="Buscar dentro deste programa..." class="form-control me-2 rounded-pill" autocomplete="off" aria-label="Buscar dentro deste programa">
        <button class="btn btn-outline-success rounded-pill" type="submit">Buscar</button>
      </form>

    </section>

    <!-- Mais buscados neste programa são inseridos aqui pelo buscas-populares.js -->

    <section id="historicoBusca" class="historico-busca" aria-label="Pesquisas recentes" hidden>
      <div class="historico-cabecalho">
        <span class="historico-titulo">Pesquisas recentes</span>
        <button type="button" id="limparHistoricoBtn" class="btn-limpar-historico">Limpar histórico</button>
      </div>
      <div id="listaHistoricoBusca" class="historico-lista"></div>
    </section>

    <div id="carregamentoResultados" class="carregamento-resultados" role="status" aria-live="polite">
      <img src="../images/carregando.gif" alt="Carregando resultados">
    </div>

    <section id="secaoVTsAgro" class="secao-vts-agro area-resultados" hidden>
      <div id="tabsVts" class="tabs-vts" role="tablist" aria-label="VTs do Agrocultura por ano"></div>
      <div id="wrapTabelaVtsAgro" class="table-wrap" hidden>
        <table class="results-table vts-dinamica-table">
          <thead id="theadVtsAgro"></thead>
          <tbody id="tbodyVtsAgro"><tr><td>Selecione um ano acima.</td></tr></tbody>
        </table>
      </div>
    </section>

    <div class="resultados-cabecalho area-resultados" hidden>
      <h2 class="page-title">Mídias gerais do programa:</h2>
      <p id="statusBusca" class="status-busca"></p>
    </div>

    <div class="table-wrap area-resultados" hidden>
      <table class="results-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>DESCRIÇÃO</th>
            <th>DATA</th>
            <th>LOCAL</th>
            <th>REPÓRTER</th>
            <th>AFILIADA / EMISSORA</th>
            <th>PROGRAMA</th>
            <th>EDITORIA</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>

    <div class="paginacao area-resultados" hidden>
      <button id="loadMoreBtn" class="btn-carregar-mais" style="display:none;">Carregar mais resultados</button>
    </div>
  </main>

  <script src="../js/dados.js"></script>
  <script src="../js/sinonimos.js"></script>
  <script src="../js/search-engine.js?v=2"></script>
  <script src="../js/historico-busca.js"></script>
  <script src="../js/buscas-populares.js"></script>
  <script src="../js/autocomplete.js"></script>
  <script src="../js/vts-agrocultura.js?v=2"></script>
  <script src="../js/creditos.js?v=2"></script>
  <script src="../js/catalogo-ui.js?v=7"></script>
  <script src="../js/creditos-ui.js?v=1"></script>
</body>
</html>
