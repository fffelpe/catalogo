<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Busca por Programa</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header class="header-principal">
        <nav>
            <a href="../index.html">Voltar para o Início</a>
        </nav>
        <h1>Filtro por Programa</h1>
    </header>

    <main class="container-filtros">
        <!-- O formulário envia os parâmetros para a página de resultados -->
        <form action="resultado-busca.html" method="GET" class="form-busca-avancada">
            
            <div class="grupo-filtro">
                <label for="programa">Selecione o Programa:</label>
                <select name="programa" id="programa" class="select-programa">
                    <option value="">Todos</option>
                    <option value="JORNAL DA TARDE">Jornal da Tarde</option>
                    <option value="AGROCULTURA">Agrocultura</option>
                    <option value="JORNAL DA CULTURA">Jornal da Cultura</option>
                </select>
            </div>

            <div class="grupo-filtro">
                <input 
                    type="text" 
                    name="q" 
                    placeholder="Palavra-chave adicional (opcional)..." 
                    class="input-busca"
                >
            </div>

            <button type="submit" class="btn-buscar">Filtrar Acervo</button>
        </form>
    </main>
</body>
</html>
