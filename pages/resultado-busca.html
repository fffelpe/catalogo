<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultados da Busca — Catálogo de Mídias</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="pagina-cabecalho">
    <div class="pagina-logo">
      <div>
        <span class="pagina-logo-titulo">Catálogo de Mídias</span>
        <span class="pagina-logo-subtitulo">Resultado da busca</span>
      </div>
    </div>
    <a href="../index.html">Voltar para o início</a>
  </header>

  <div class="pagina-busca">
    <label for="searchInput" class="sr-only">Refinar busca</label>
    <input type="text" id="searchInput" placeholder="Refinar busca atual…" />
  </div>

  <h2 id="pageTitle" class="pagina-titulo">Resultados</h2>
  <p id="pageStatus" class="pagina-status">Carregando…</p>

  <ul id="resultsContainer" class="lista-itens">
    <p>Carregando acervo…</p>
  </ul>

  <div class="paginacao">
    <button id="loadMoreBtn" class="btn-carregar-mais" style="display: none">
      Carregar mais resultados
    </button>
  </div>

  <script src="../js/dados.js"></script>
  <script src="../js/catalogo-ui.js"></script>
</body>
</html>
