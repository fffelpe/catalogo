<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
  <title>Resultados da Busca - Catálogo de Mídias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="logo" aria-label="Catálogo de Mídias - Início">
    <img src="../images/logo.png" alt="Logo TV Cultura" class="logo-icon">
      <span class="logo-text">
        <span class="titulo">CATÁLOGO DE MÍDIAS</span>
        <span class="subtitulo">JORNALISMO</span>
      </span>
    </a>
  </header>

  <main class="pagina-resultados">
    <div class="mb-4 bootstrap-search-wrapper">
      <form id="searchForm" class="d-flex" role="search">
        <input class="form-control me-2 rounded-pill" type="search" id="searchInput"
          placeholder="Refinar busca atual..." aria-label="Refinar busca">
        <button class="btn btn-outline-success rounded-pill" type="submit">Buscar</button>
      </form>
    </div>

    <h2 class="page-title">Resultado da Busca:</h2>
    <p id="statusBusca" class="status-busca"></p>

    <div class="table-wrap">
      <table class="results-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>DESCRIÇÃO</th>
            <th>DATA</th>
            <th>LOCAL</th>
            <th>REPÓRTER</th>
            <th>AFILIADA / EMISSORA</th>
            <th>PROGRAMA</th>
            <th>EDITORIA</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr><td colspan="8">Carregando acervo...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="paginacao">
      <button id="loadMoreBtn" class="btn-carregar-mais" style="display:none;">
        Carregar mais resultados
      </button>
    </div>
  </main>

  <script src="../js/dados.js"></script>
  <script src="../js/catalogo-ui.js?v=2"></script>
</body>
</html>
