<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans+JP:400,500,600&display=swap" rel="stylesheet" />
  <link href="../css/main.css" rel="stylesheet" />
  <title>Resultado da Busca — Catálogo de Mídias</title>
</head>
<body>
  <header class="pagina-cabecalho">
    <a href="../index.html" class="pagina-logo">
      <img src="../img/logo.png" alt="" />
      <span>
        <span class="pagina-logo-titulo">CATÁLOGO DE MÍDIAS</span>
        <span class="pagina-logo-subtitulo">Jornalismo</span>
      </span>
    </a>
    <a href="login.html">Login</a>
  </header>

  <form class="pagina-busca" action="resultado-busca.html" method="get">
    <label for="q" class="sr-only">Pesquisar</label>
    <input type="search" id="q" name="q" placeholder="Pesquisar EX: queimadas" />
  </form>

  <h1 class="pagina-titulo" id="tituloResultado">Resultado da busca</h1>
  <p class="pagina-status" id="statusResultado">Carregando…</p>
  <ul class="lista-itens" id="listaResultados" aria-live="polite"></ul>

  <!-- Papa Parse: necessário para dados.js ler as planilhas em CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/catalogo-ui.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const termo = params.get("q") || "";

    document.getElementById("tituloResultado").textContent = termo
      ? `Resultado da busca: "${termo}"`
      : "Resultado da busca";

    const statusEl = document.getElementById("statusResultado");
    const listaEl = document.getElementById("listaResultados");

    carregarTodosOsDados()
      .then((todos) => {
        const filtrados = filtrarItens(todos, termo);
        statusEl.textContent = `${filtrados.length} resultado(s) encontrado(s).`;
        renderizarLista(listaEl, filtrados);
      })
      .catch(() => {
        statusEl.textContent = "Não foi possível carregar os dados agora. Tente novamente em instantes.";
      });
  </script>
</body>
</html>
