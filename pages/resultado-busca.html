<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans+JP:400,500,600&display=swap" rel="stylesheet" />
  <link href="../css/main.css" rel="stylesheet" />
  <title>Resultado da Busca — Catálogo de Mídias</title>
</head>
<body>
  <main class="resultado-frame" aria-label="Resultado da busca no catálogo">
    <a href="../index.html" aria-label="Voltar para a home">
      <img src="../images/logo.png" class="resultado-logo" width="111" height="111" alt="Catálogo de Mídias" />
    </a>

    <h1 class="resultado-title">CATÁLOGO DE MÍDIAS</h1>
    <p class="resultado-subtitle">JORNALISMO</p>

    <form action="resultado-busca.html" method="get" aria-label="Pesquisar no catálogo">
      <div class="resultado-search-box" aria-hidden="true"></div>
      <img src="../images/lupa.png" class="resultado-search-icon" width="29" height="27" alt="" />
      <label for="search" class="sr-only">Pesquisar</label>
      <input id="search" name="q" type="search" class="resultado-search-input" placeholder="Pesquisar EX: queimadas" />
    </form>

    <p class="resultado-label">Resultado da Busca:</p>

    <section class="resultado-table-wrap" aria-label="Tabela de resultados da busca">
      <table class="resultado-table">
        <thead>
          <tr>
            <th class="resultado-col-id">ID</th>
            <th class="resultado-col-decupagem">Decupagem / Transcrição</th>
            <th class="resultado-col-duracao">Duração</th>
            <th class="resultado-col-data">Data</th>
            <th class="resultado-col-reporter">Repórter</th>
          </tr>
        </thead>
        
        </tbody>
      </table>
    </section>

    <a href="login.html" class="resultado-login">Login</a>
  </main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="../js/dados.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const query = (params.get("q") || "").toLowerCase();
  const tbody = document.querySelector(".resultado-table tbody");

  carregarTodosOsDados().then(todos => {
    const encontrados = todos.filter(item =>
      item.assunto.toLowerCase().includes(query) ||
      item.id.toLowerCase().includes(query) ||
      item.reporter.toLowerCase().includes(query) ||
      item.local.toLowerCase().includes(query)
    );

    if (encontrados.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5">Nenhum resultado encontrado para "${query}".</td></tr>`;
      return;
    }

    tbody.innerHTML = encontrados.map(item => `
      <tr>
        <td><a href="programa.html?programa=${item.programa}">${item.id}</a></td>
        <td>${item.assunto}</td>
        <td>${item.data}</td>
        <td>${item.data}</td>
        <td>${item.reporter || item.local}</td>
      </tr>
    `).join("");
  });
</script>
</body>
</html>
