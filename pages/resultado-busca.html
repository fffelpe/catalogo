<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados da Busca - Catálogo</title>
    <link rel="stylesheet" href="../css/main.css">
    
    <!-- IMPORTANTE: Biblioteca para ler o imgs.csv de forma rápida e sem travar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <header class="header-principal">
        <nav>
            <a href="../index.html">Voltar para o Início</a>
        </nav>
        <h1>Resultados da Busca</h1>
    </header>

    <main class="container-resultados">
        <!-- Barra de nova busca na própria página de resultados (Note o id="searchInput") -->
        <div class="busca-interna">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Refinar busca atual..." 
                class="input-busca"
            >
        </div>

        <!-- IMPORTANTE: A div com id="resultsContainer" é onde o JavaScript vai injetar os itens -->
        <!-- Mantenha a sua classe de grid/layout original na tag class -->
        <div id="resultsContainer" class="sua-classe-css-de-grid">
            <p>Carregando acervo...</p>
        </div>

        <!-- Botão para paginação (Evita travamentos renderizando tudo de uma vez) -->
        <div class="paginacao">
            <button id="loadMoreBtn" class="btn-carregar-mais" style="display:none;">
                Carregar mais resultados
            </button>
        </div>
    </main>

    <!-- IMPORTANTE: Os scripts lógicos devem ser chamados no final do body -->
    <script src="../js/dados.js"></script>
    <script src="../js/catalogo-ui.js"></script>
</body>
</html>
