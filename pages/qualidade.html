<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
  <title>Painel de Qualidade - Catálogo de Mídias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=6">
  <link rel="stylesheet" href="../css/catalogo-quality.css?v=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="logo" aria-label="Catálogo de Mídias - Início">
      <img src="../images/logo.png" alt="Logo TV Cultura" class="logo-icon">
      <span class="logo-text"><span class="titulo">CATÁLOGO DE MÍDIAS</span><span class="subtitulo">JORNALISMO</span></span>
    </a>
  </header>

  <main class="quality-page">
    <section class="quality-heading">
      <div>
        <p class="quality-eyebrow">Diagnóstico do acervo</p>
        <h1>Painel de Qualidade</h1>
        <p>Monitore a integridade e a completude dos registros do acervo jornalístico.</p>
      </div>
      <a class="quality-back-link" href="resultado-busca.html">Voltar à busca</a>
    </section>

    <section id="qualityState" class="quality-state" aria-live="polite">Carregando diagnóstico...</section>

    <section id="qualityContent" hidden>
      <div id="qualitySummary" class="quality-summary-grid" aria-label="Resumo de qualidade"></div>

      <section class="quality-filters" aria-label="Filtros do painel">
        <label>
          <span>Programa</span>
          <select id="qualityProgramFilter" class="form-select">
            <option value="">Todos os programas</option>
          </select>
        </label>
        <label>
          <span>Severidade</span>
          <select id="qualitySeverityFilter" class="form-select">
            <option value="">Todas</option>
            <option value="critical">Crítica</option>
            <option value="warning">Aviso</option>
            <option value="info">Informação</option>
            <option value="ok">Sem problemas</option>
          </select>
        </label>
        <label>
          <span>Tipo de problema</span>
          <select id="qualityTypeFilter" class="form-select">
            <option value="">Todos</option>
          </select>
        </label>
      </section>

      <div id="qualityCreditsStatus" class="quality-credits-status" aria-live="polite"></div>

      <section class="quality-table-card" aria-label="Registros avaliados">
        <div class="quality-table-wrap">
          <table class="quality-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Programa</th>
                <th>Data</th>
                <th>Problemas</th>
                <th>Severidade</th>
              </tr>
            </thead>
            <tbody id="qualityTableBody"></tbody>
          </table>
        </div>
        <p id="qualityTableStatus" class="quality-table-status"></p>
      </section>
    </section>
  </main>

  <script src="../js/media-id.js?v=1"></script>
  <script src="../js/dados.js?v=6"></script>
  <script src="../js/creditos.js?v=4"></script>
  <script src="../js/media-enrichment.js?v=1"></script>
  <script src="../js/catalogo-quality.js?v=1"></script>
  <script src="../js/catalogo-quality-ui.js?v=1"></script>
</body>
</html>
