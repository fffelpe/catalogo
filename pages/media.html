<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
  <title>Ficha do Media ID - Catálogo de Mídias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=6">
  <link rel="stylesheet" href="../css/id-copy.css?v=1">
  <link rel="stylesheet" href="../css/media-detail.css?v=2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="logo" aria-label="Catálogo de Mídias - Início">
      <img src="../images/logo.png" alt="Logo TV Cultura" class="logo-icon">
      <span class="logo-text"><span class="titulo">CATÁLOGO DE MÍDIAS</span><span class="subtitulo">JORNALISMO</span></span>
    </a>
  </header>

  <main class="media-page">
    <nav class="media-breadcrumb" aria-label="Navegação estrutural">
      <a href="../index.html">Início</a><span aria-hidden="true">›</span>
      <a id="backToResults" href="resultado-busca.html">Resultados da busca</a><span aria-hidden="true">›</span>
      <span id="breadcrumbMediaId">Media ID</span>
    </nav>

    <section id="mediaState" class="media-state" aria-live="polite">Carregando ficha...</section>

    <section id="mediaContent" hidden>
      <div class="media-heading-row">
        <div>
          <p class="media-eyebrow">Ficha do Media ID</p>
          <div class="media-title-line">
            <h1 id="mediaTitle">Media ID</h1>
            <button id="copyMediaId" type="button" class="media-copy-button" aria-label="Copiar Media ID" title="Copiar Media ID">
              <img src="../images/copiar.png?v=4" alt="" aria-hidden="true">
            </button>
          </div>
        </div>
      </div>

      <div class="media-hero-grid">
        <aside id="mediaMetadata" class="media-metadata-card" aria-label="Metadados editoriais"></aside>
      </div>

      <section class="media-section media-description-card">
        <h2>Descrição</h2>
        <p id="mediaDescription"></p>
      </section>

      <div class="media-two-columns">
        <section class="media-section">
          <div class="media-section-heading">
            <h2>Trechos do vídeo</h2>
            <span class="media-section-note">Trechos indexados</span>
          </div>
          <div id="mediaSegments" class="media-segments"></div>
        </section>

        <section class="media-section">
          <h2>Palavras-chave e assuntos</h2>
          <div id="mediaTags" class="media-tags"></div>
        </section>
      </div>

      <section id="mediaCreditsSection" class="media-section" hidden>
        <h2>Créditos</h2>
        <div id="mediaCredits"></div>
      </section>

      <section class="media-section">
        <div class="media-section-heading">
          <h2>Conteúdos relacionados</h2>
        </div>
        <div id="mediaRelated" class="media-related-grid"></div>
      </section>

      <section class="media-section media-quality-section">
        <div class="media-section-heading">
          <h2>Completude do registro</h2>
          <a href="qualidade.html">Abrir painel de qualidade</a>
        </div>
        <div id="mediaQuality"></div>
      </section>
    </section>
  </main>

  <script src="../js/media-id.js?v=1"></script>
  <script src="../js/dados.js?v=7"></script>
  <script src="../js/creditos.js?v=4"></script>
  <script src="../js/media-enrichment.js?v=1"></script>
  <script src="../js/media-segments.js?v=1"></script>
  <script src="../js/related-media.js?v=1"></script>
  <script src="../js/catalogo-quality.js?v=1"></script>
  <script src="../js/media-detail.js?v=2"></script>
</body>
</html>
