<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Mídias — Jornalismo</title>
  <link rel="icon" href="images/favicon.ico" type="image/png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans+JP:400,500,600&display=swap" />
  <link rel="stylesheet" href="css/main.css" />
  
  <!-- 1. ADICIONADO: Biblioteca PapaParse para ler as planilhas CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="home-page">
  <main class="home-frame" aria-label="Catálogo de mídias de jornalismo">

    <!-- Cabeçalho -->
    <header class="home-header">
      <div class="home-brand">
        <a href="index.html" aria-label="Catálogo de Mídias">
          <img src="images/logo.png" class="home-logo" width="64" height="64" alt="Catálogo de Mídias" />
        </a>
        <div class="home-titles">
          <h1 class="home-title">CATÁLOGO DE MÍDIAS</h1>
          <p class="home-subtitle">JORNALISMO</p>
        </div>
      </div>
      <a href="pages/login.html" class="home-login">Login</a>
    </header>

    <!-- Busca -->
    <section class="home-search-container">
      <!-- 2. ALTERADO: Removido action/method para evitar o envio e permitir busca em tempo real -->
      <form id="searchForm" onsubmit="return false;" aria-label="Pesquisar no catálogo">
        <div class="home-search-box">
          <img src="images/lupa.png" class="home-search-icon" width="24" height="24" alt="" />
          <label for="search" class="sr-only">Pesquisar</label>
          <input
            id="search"
            name="q"
            type="search"
            class="home-search-input"
            placeholder="Pesquisar EX: fachada, queimadas..."
          />
        </div>
      </form>
    </section>

    <!-- 3. ADICIONADO: Área para exibir os resultados da busca -->
    <section id="resultadosContainer" class="home-results-container" style="margin: 20px 0;">
      <!-- Os cards de resultados de 'fachada', etc. aparecerão aqui -->
    </section>

    <!-- Menu de navegação dos programas -->
    <nav class="home-nav" aria-label="Programas do catálogo">
      <ul class="home-nav-list" id="programasNav">
        <!-- Preenchido via JS a partir de dados.js -->
      </ul>
    </nav>

  </main>

  <!-- Script que contém as funções carregarTodosOsDados e buscarTermo -->
  <script src="js/dados.js"></script>

  <!-- 4. ALTERADO: Lógica de inicialização dos dados, busca e menu -->
  <script>
    let BANCO_DE_DADOS = [];

    // Carrega dados das planilhas e escuta a busca
    async function inicializarSistema() {
      const container = document.getElementById("resultadosContainer");
      container.innerHTML = "<p style='color: #888;'>Carregando mídias do sistema...</p>";

      // 1. Carrega o banco de dados via dados.js
      BANCO_DE_DADOS = await carregarTodosOsDados();
      container.innerHTML = ""; // Limpa a mensagem de carregamento

      // 2. Conecta a caixa de texto à busca em tempo real
      const inputBusca = document.getElementById("search");
      if (inputBusca) {
        inputBusca.addEventListener("input", (e) => {
          const termo = e.target.value;
          
          if (!termo.trim()) {
            container.innerHTML = "";
            return;
          }

          const resultados = buscarTermo(BANCO_DE_DADOS, termo);
          exibirResultados(resultados);
        });
      }
    }

    // Função que desenha os resultados na tela
    function exibirResultados(itens) {
      const container = document.getElementById("resultadosContainer");
      container.innerHTML = "";

      if (itens.length === 0) {
        container.innerHTML = "<p>Nenhum resultado encontrado.</p>";
        return;
      }

      const totalMsg = document.createElement("p");
      totalMsg.style.margin = "10px 0";
      totalMsg.innerHTML = `<strong>${itens.length}</strong> resultado(s) encontrado(s):`;
      container.appendChild(totalMsg);

      itens.forEach(item => {
        const nomePrograma = NOMES_PROGRAMAS[item.programa] || "Não Identificado";
        
        const card = document.createElement("div");
        card.style.background = "rgba(255, 255, 255, 0.05)";
        card.style.border = "1px solid rgba(255, 255, 255, 0.1)";
        card.style.borderRadius = "8px";
        card.style.padding = "15px";
        card.style.marginBottom = "10px";

        card.innerHTML = `
          <div style="font-size: 0.85em; text-transform: uppercase; color: #888;">
            [${item.tipo}] — ${nomePrograma}
          </div>
          <div style="font-size: 1.1em; font-weight: bold; margin: 5px 0;">
            ID: ${item.id}
          </div>
          <div>${item.assunto || "Sem detalhes disponíveis."}</div>
          <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">
            ${item.data ? `Data: ${item.data}` : ""} 
            ${item.local ? ` | Local: ${item.local}` : ""} 
            ${item.reporter ? ` | Repórter: ${item.reporter}` : ""}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Monta o menu dinâmico dos programas na nav
    function montarMenuHome() {
      const nav = document.getElementById('programasNav');
      if (!nav || typeof NOMES_PROGRAMAS === 'undefined') return;

      Object.entries(NOMES_PROGRAMAS).forEach(([slug, nome]) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `pages/programa.html?programa=${slug}`;
        a.textContent = nome;
        li.appendChild(a);
        nav.appendChild(li);
      });
    }

    // Inicia tudo ao carregar a página
    document.addEventListener("DOMContentLoaded", () => {
      montarMenuHome();
      inicializarSistema();
    });
  </script>
</body>
</html>
