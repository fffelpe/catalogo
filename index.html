<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Catálogo de Mídias - Início</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=4">
  <link rel="stylesheet" href="css/ultimos-ids.css?v=2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo" aria-label="Catálogo de Mídias - Início">
      <img src="images/logo.png" alt="Logo TV Cultura" class="logo-icon">
      <span class="logo-text"><span class="titulo">CATÁLOGO DE MÍDIAS</span><span class="subtitulo">JORNALISMO</span></span>
    </a>
  </header>

  <main class="pagina-inicial">
    <section class="hero-busca" aria-label="Busca principal">
      <form id="homeSearchForm" action="pages/resultado-busca.html" method="GET" class="search-bar search-bar-principal d-flex" role="search">
        <input type="search" id="searchInput" name="q" placeholder="Ex.: agricultura, inflação, enchente ou Media ID..." class="form-control me-2 rounded-pill" autocomplete="off" aria-label="Pesquisar no catálogo de mídias" required>
        <button class="btn btn-outline-success rounded-pill" type="submit">Buscar</button>
      </form>
    </section>

    <section class="programas-section" aria-labelledby="tituloProgramas">
      <h2 id="tituloProgramas" class="section-title">Navegar por programa</h2>
      <nav class="programs-nav" aria-label="Programas">
        <a href="pages/programa.html?programa=Agrocultura">Agrocultura</a>
        <a href="pages/programa.html?programa=Cartão Verde">Cartão Verde</a>
        <a href="pages/programa.html?programa=Documentários">Documentários</a>
        <a href="pages/programa.html?programa=De olho no voto">De olho no voto</a>
        <a href="pages/programa.html?programa=Jornal da Cultura">Jornal da Cultura</a>
        <a href="pages/programa.html?programa=Jornal da Tarde">Jornal da Tarde</a>
        <a href="pages/programa.html?programa=Opinião">Opinião</a>
        <a href="pages/programa.html?programa=Repórter Eco">Repórter Eco</a>
        <a href="pages/programa.html?programa=Roda Viva">Roda Viva</a>
      </nav>
    </section>

    <section id="ultimosIdsPainel" class="ultimos-ids-section" aria-labelledby="tituloUltimosIds">
      <div class="ultimos-ids-cabecalho">
        <div>
          <h2 id="tituloUltimosIds" class="section-title">Últimos IDs inseridos</h2>
          <p class="ultimos-ids-subtitulo">Registros mais recentes adicionados ao catálogo</p>
        </div>
        <p id="ultimosIdsStatus" class="ultimos-ids-status" aria-live="polite">Carregando últimos IDs...</p>
      </div>
      <div id="ultimosIdsLista" class="ultimos-ids-lista" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/media-id.js?v=1"></script>
  <script src="js/dados.js?v=4"></script>
  <script src="js/sinonimos.js"></script>
  <script src="js/search-engine.js?v=4"></script>
  <script src="js/historico-busca.js"></script>
  <script src="js/buscas-populares.js"></script>
  <script src="js/autocomplete.js"></script>
  <script src="js/catalogo-ui.js?v=11"></script>
  <script src="js/ultimos-ids.js?v=1"></script>
</body>
</html>
