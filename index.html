<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Mídias - Início</title>
    <!-- Mantenha o caminho do seu CSS original -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Substitua as classes abaixo pelas classes do seu layout original -->
    <header class="header-principal">
        <h1>Catálogo de Mídias</h1>
        <p>Busque no acervo completo (imgs.csv)</p>
    </header>

    <main class="container-busca">
        <!-- O formulário DEVE ter a action apontando para a página de resultados -->
        <form action="pages/resultado-busca.html" method="GET" class="form-busca">
            <input 
                type="text" 
                name="q" 
                placeholder="Digite a palavra-chave, ID ou repórter..." 
                required 
                class="input-busca"
            >
            <button type="submit" class="btn-buscar">Buscar</button>
        </form>
    </main>

    <footer class="footer-principal">
        <p>Sistema de Catálogo Jornalístico</p>
    </footer>
</body>
</html>
