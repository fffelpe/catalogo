<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Mídias — Jornalismo</title>
  <link rel="icon" href="images/favicon.ico" type="image/png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans+JP:400,500,600&display=swap" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="resultado-page">
  <main class="resultado-frame" aria-label="Pesquisa no catálogo de mídias">
    
    <!-- Cabeçalho idêntico ao das páginas internas -->
    <header class="resultado-header">
      <a href="index.html" aria-label="Catálogo de Mídias">
        <img src="images/logo.png" class="resultado-logo" width="111" height="111" alt="Catálogo de Mídias" />
      </a>
      <div class="resultado-titles">
        <h1 class="resultado-title">CATÁLOGO DE MÍDIAS</h1>
        <p class="resultado-subtitle">JORNALISMO</p>
      </div>
    </header>

    <!-- Formulário usando exatamente as mesmas classes do resultado-busca.html -->
    <section class="resultado-search-container">
      <form action="pages/resultado-busca.html" method="get" aria-label="Pesquisar no catálogo">
        <div class="resultado-search-box" aria-hidden="true"></div>
        <img src="images/lupa.png" class="resultado-search-icon" width="29" height="27" alt="" />
        <label for="search" class="sr-only">Pesquisar</label>
        <input 
          id="search" 
          name="q" 
          type="search" 
          class="resultado-search-input" 
          placeholder="Pesquisar EX: queimadas" 
          required
        />
      </form>
    </section>

    <!-- Rodapé de Login -->
    <footer style="margin-top: 40px; text-align: center;">
      <a href="pages/login.html" class="resultado-login">Login</a>
    </footer>
  </main>
</body>
</html>
